[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-sim-policy-lab"
version = "0.1.0"
description = "Policy-driven robotics simulation experiments with measurable task execution, physics validation, and simulator-to-simulator testing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "EslaM-X", email = "eslam.kora60@gmail.com" }]
keywords = ["robotics", "simulation", "policy", "mujoco", "pybullet", "sim2sim", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
mujoco = ["mujoco>=3.0"]
pybullet = ["pybullet>=3.2.5"]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["rspl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
