name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core + test deps
        run: pip install -e ".[test]"
      - name: Pure + kinematic tests
        run: python -m pytest tests/test_pure.py tests/test_experiment.py -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check rspl examples tests
      - name: Ruff format check
        run: ruff format --check rspl examples tests

  physics:
    name: Physics backends (MuJoCo + PyBullet)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with physics backends
        run: pip install -e ".[mujoco,pybullet,test]"
      - name: Full test suite incl. physics
        run: python -m pytest tests/ -v
